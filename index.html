<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13233d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="高捷班次">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>高捷班次查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面：左側查詢面板（手機在上方），右側為發車看板式的結果清單；紅橘兩線色只用來標示路線 */
:root{
  --bg:#f3f4f6;
  --panel:#ffffff;
  --ink:#16191f;
  --muted:#5d6470;
  --line:#dfe2e7;
  --accent:#1d4f91;
  --red:#d6202e;
  --orange:#ee8a00;
  --good:#1f7a4d;
  --soft:#eef1f5;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-time:"Barlow Condensed","Roboto Condensed","Arial Narrow",var(--font-body);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --panel:#181c22; --ink:#eceef2; --muted:#9aa2ae; --line:#2b313a;
    --accent:#7fb0f0; --red:#ff5a63; --orange:#ffa733; --good:#5fcf95; --soft:#222831;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --panel:#181c22; --ink:#eceef2; --muted:#9aa2ae; --line:#2b313a;
  --accent:#7fb0f0; --red:#ff5a63; --orange:#ffa733; --good:#5fcf95; --soft:#222831;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.legend{display:flex;gap:12px;color:var(--muted);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.R{background:var(--red)} .dot.O{background:var(--orange)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:16px;position:sticky;top:12px}
.field{display:grid;gap:6px}
label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
select,input[type=time],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px}
select:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.od{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.od .stack{display:grid;gap:10px}
.swap{width:42px;height:94px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:18px;cursor:pointer}
.swap:hover{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:7px 4px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:14px}
.seg input:checked+label{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input:focus-visible+label{outline:2px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:0}
.favs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.favs:empty{display:none}
.fav{flex:none;display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:999px;font-size:14px}
.fav button{font:inherit;background:none;border:0;color:var(--ink);cursor:pointer;padding:8px 4px 8px 13px;min-height:40px}
.fav button.x{color:var(--muted);padding:8px 12px 8px 6px;font-size:13px}
.fav.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.favbtn{font:inherit;font-size:14px;justify-self:start;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;min-height:36px}
.more{border-top:1px solid var(--line);padding-top:12px}
.more .field{margin-top:12px}
.more>summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--ink);min-height:32px;display:flex;align-items:center;gap:8px}
.more>summary span{color:var(--muted);font-weight:400;font-size:13px}
.notecard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.notecard[hidden]{display:none}
.notecard h3{margin:0;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ncar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.ncar b{color:var(--good)}
.cars{display:inline-flex;gap:3px;vertical-align:middle}
.cars i{width:22px;height:12px;border-radius:3px;border:1.5px solid var(--muted);display:inline-block}
.cars i.on{background:var(--good);border-color:var(--good)}
.ntext{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.nbtn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:40px}
.nbtn.primary{background:var(--good);border-color:var(--good);color:var(--panel);font-weight:700}
.nbtn.link{background:none;border:0;color:var(--accent);padding:4px 0;min-height:32px}
.nbtn.danger{color:var(--red)}
.addnote{font:inherit;font-size:14px;text-align:left;background:none;border:1px dashed var(--line);border-radius:8px;color:var(--accent);padding:10px 12px;cursor:pointer;min-height:44px}
.nedit{display:grid;gap:10px}
.nedit textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:70px;resize:vertical}
.nactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill.less{border-color:var(--good);color:var(--good)}
.results{display:grid;gap:12px;min-width:0}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.route{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:18px;font-weight:700}
.route .arrow{color:var(--muted);font-weight:400}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--font-time);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.note{font-size:13px;color:var(--muted);margin:0}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trip{border-top:1px solid var(--line)}
.trip:first-child{border-top:0}
.trip>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 16px 12px 12px}
.trip>summary::-webkit-details-marker{display:none}
.trip>summary:hover{background:var(--soft)}
.stripe{width:5px;align-self:stretch;border-radius:3px;display:flex;flex-direction:column;overflow:hidden}
.stripe i{flex:1}
.stripe .R{background:var(--red)} .stripe .O{background:var(--orange)}
.times{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.t{font-family:var(--font-time);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.t.arr{font-size:22px;color:var(--muted);font-weight:500}
.sep{color:var(--muted)}
.meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.pill.R{border-color:var(--red);color:var(--red)} .pill.O{border-color:var(--orange);color:var(--orange)}
.pill.xfer{background:var(--soft)}
.right{text-align:right;display:grid;gap:2px;justify-items:end}
.dur{font-family:var(--font-time);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.dur small{font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
.wait{font-size:12px;font-weight:700;color:var(--good);white-space:nowrap}
.trip.next{background:color-mix(in srgb,var(--good) 7%,transparent)}
.trip.next .wait{background:var(--good);color:var(--panel);padding:1px 8px;border-radius:999px}
.trip.past{opacity:.5}
.legs{padding:4px 16px 16px 31px;display:grid;gap:12px}
.leg h4{margin:0 0 6px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.stops{list-style:none;margin:0;padding:0 0 0 12px;border-left:3px solid var(--line);display:grid;gap:2px}
.leg.R .stops{border-color:var(--red)} .leg.O .stops{border-color:var(--orange)}
.stops li{display:grid;grid-template-columns:52px 1fr;font-size:13px;color:var(--muted)}
.stops li b{font-family:var(--font-time);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.stops li.end{color:var(--ink);font-weight:700}
.xferline{font-size:13px;color:var(--muted);padding-left:12px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
footer{grid-column:1/-1;font-size:12px;color:var(--muted)}
.wrap{padding-top:max(20px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(40px,env(safe-area-inset-bottom))}
.offline{display:none;font-size:12px;font-weight:700;color:var(--good);border:1px solid var(--good);border-radius:999px;padding:1px 9px}
body.is-offline .offline{display:inline-block}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{grid-template-columns:1fr;gap:14px;padding:14px 12px 32px}
  header h1{font-size:20px}
  .panel{position:static;padding:14px;gap:12px}
  select,input[type=time],input[type=number]{font-size:16px;min-height:46px}
  .swap{height:102px}
  .chip{padding:7px 13px;font-size:14px}
  .t{font-size:28px}
  .trip>summary{padding:14px 14px 14px 10px;gap:12px}
  .stats{gap:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>高捷班次查詢</h1>
    <div class="legend"><span><i class="dot R"></i>紅線</span><span><i class="dot O"></i>橘線</span><span>紅橘互轉：美麗島站</span></div>
    <span class="offline">離線模式・時刻表照常可查</span>
  </header>

  <form class="panel" id="form" autocomplete="off">
    <div class="favs" id="favs" aria-label="常用路線"></div>
    <div class="od">
      <div class="stack">
        <div class="field"><label for="from">起站</label><select id="from"></select></div>
        <div class="field"><label for="to">終站</label><select id="to"></select></div>
      </div>
      <button type="button" class="swap" id="swap" aria-label="對調起站與終站" title="對調起站與終站">⇅</button>
    </div>
    <button type="button" class="favbtn" id="favbtn">☆ 加入常用路線</button>

    <div class="field">
      <span class="lbl" id="modeLbl">時間範圍是指</span>
      <div class="seg" role="radiogroup" aria-labelledby="modeLbl">
        <input type="radio" name="mode" id="modeDep" value="dep" checked><label for="modeDep">上車時間</label>
        <input type="radio" name="mode" id="modeArr" value="arr"><label for="modeArr">抵達時間</label>
      </div>
    </div>

    <div class="row2">
      <div class="field"><label for="tFrom">從</label><input type="time" id="tFrom" step="60"></div>
      <div class="field"><label for="tTo">到</label><input type="time" id="tTo" step="60"></div>
    </div>
    <div class="chips" aria-label="快速設定時間範圍">
      <button type="button" class="chip" data-range="60">現在起 1 小時</button>
      <button type="button" class="chip" data-range="180">現在起 3 小時</button>
      <button type="button" class="chip" data-range="all">整天</button>
    </div>

    <details class="more" id="more">
      <summary>更多設定<span id="moreSum"></span></summary>
      <div class="field">
        <label for="day">日別</label>
        <select id="day"></select>
        <p class="hint" id="dayHint"></p>
      </div>
      <div class="field">
        <label for="xfer">轉乘預留時間（分鐘）</label>
        <input type="number" id="xfer" min="1" max="15" value="4" inputmode="numeric">
        <p class="hint">只在紅橘線互轉時使用，代表在美麗島站換月台所需的時間。</p>
      </div>
    </details>
  </form>

  <section class="results" aria-live="polite">
    <div class="summary" id="summary"></div>
    <div class="notecard" id="noteCard"></div>
    <div class="list" id="list"></div>
  </section>

  <footer id="foot"></footer>
</div>

const LINES = ["R","O"];
const LINE_NAME = {R:"紅線", O:"橘線"};
const XFER_ID = {R:"R10", O:"O5"};
const pad = n => String(n).padStart(2,"0");
const fmt = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m/60)) + ":" + pad(m % 60); };
const toSvc = m => (m < 240 ? m + 1440 : m);           // 凌晨 0–4 點算前一個營運日
const parseT = s => { if(!s) return null; const [h,mm] = s.split(":").map(Number); return h*60+mm; };

// ---------- 車站 ----------
const nameOf = {}, lineOf = {};
const stations = [];          // {name, ids:[...], lines:[...]}
const byName = {};
for (const L of LINES) for (const [id, name] of DATA.lines[L]) {
  nameOf[id] = name; lineOf[id] = L;
  if (!byName[name]) { byName[name] = {name, ids:[], lines:[]}; stations.push(byName[name]); }
  byName[name].ids.push(id); byName[name].lines.push(L);
}

// ---------- 班次 ----------
const A = "0123456789abcdefghijklmnopqrstuvwxyz";
const tripsBy = {};           // day -> line -> [trip]
for (const [day, li, dir, p0, t0, pi] of DATA.trips) {
  const L = LINES[li], seq = DATA.lines[L], pat = DATA.pats[pi];
  const stops = [], times = [t0], idx = {};
  for (let i = 0; i <= pat.length; i++) {
    const id = seq[p0 + (dir ? i : -i)][0];
    stops.push(id); idx[id] = i;
    if (i < pat.length) times.push(times[i] + A.indexOf(pat[i]));
  }
  const trip = {day, L, stops, times, idx, head: nameOf[stops[stops.length-1]]};
  ((tripsBy[day] ||= {})[L] ||= []).push(trip);
}

function legs(day, fromId, toId) {
  const L = lineOf[fromId], out = [];
  for (const t of (tripsBy[day]?.[L] || [])) {
    const i = t.idx[fromId], j = t.idx[toId];
    if (i !== undefined && j !== undefined && j > i)
      out.push({trip:t, i, j, dep:t.times[i], arr:t.times[j], est: j === t.stops.length-1});
  }
  return out.sort((a,b) => a.dep - b.dep);
}

function search(o, d, day, xfer) {
  const O = byName[o], D = byName[d], res = [];
  let direct = false;
  for (const oid of O.ids) for (const did of D.ids) {
    if (lineOf[oid] === lineOf[did]) {
      direct = true;
      for (const l of legs(day, oid, did)) res.push({legs:[l], dep:l.dep, arr:l.arr, est:l.est});
    }
  }
  if (!direct) {
    const oid = O.ids[0], did = D.ids[0];
    const l1s = legs(day, oid, XFER_ID[lineOf[oid]]);
    const l2s = legs(day, XFER_ID[lineOf[did]], did);
    const best = new Map();   // 同一班第二段車只保留最晚出發（等最少）的第一段
    for (const l1 of l1s) {
      const l2 = l2s.find(x => x.dep >= l1.arr + xfer);
      if (!l2) continue;
      const cur = best.get(l2);
      if (!cur || cur.dep < l1.dep) best.set(l2, {legs:[l1,l2], dep:l1.dep, arr:l2.arr, est:l2.est, wait:l2.dep - l1.arr});
    }
    res.push(...best.values());
  }
  return {res: res.sort((a,b) => a.dep - b.dep), direct};
}

const DAY_SHORT = ["平日","假日前一天","假日","週日"];
function autoDay(date) {
  const svc = new Date(date);
  if (svc.getHours() < 4) svc.setDate(svc.getDate() - 1);
  const w = svc.getDay();           // 0=日
  return w === 0 ? 3 : w === 6 ? 2 : w === 5 ? 1 : 0;
}
function nowSvc() { const n = new Date(); return toSvc(n.getHours()*60 + n.getMinutes()); }

    go.addEventListener("click", () => { els.from.value = f[0]; els.to.value = f[1]; render(); });
    const x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "✕";
    x.setAttribute("aria-label", `移除常用路線 ${f[0]} 到 ${f[1]}`);
    x.addEventListener("click", () => { favs.splice(k, 1); saveFavs(favs); render(); });
    wrap.append(go, x); box.appendChild(wrap);
  });
  const has = favs.some(f => f[0] === o && f[1] === d);
  const btn = $("favbtn");
  btn.textContent = has ? "★ 已在常用路線" : "☆ 加入常用路線";
  btn.disabled = has || o === d;
  btn.style.opacity = btn.disabled ? .55 : 1;
}
$("favbtn").addEventListener("click", () => {
  const o = els.from.value, d = els.to.value;
  if (o === d || favs.some(f => f[0] === o && f[1] === d)) return;
  favs.push([o, d]); saveFavs(favs); render();
});
if (window.matchMedia("(min-width: 761px)").matches) $("more").open = true;

// ---------- 車廂備註（存在這支手機 / 這個瀏覽器） ----------
const CARS = {front:["車頭","第 1 節"], mid:["中間","第 2 節"], rear:["車尾","第 3 節"]};
function loadNotes(){ try { return JSON.parse(localStorage.getItem("krtc-note") || "{}"); } catch (e) { return {}; } }
let notes = loadNotes();
function saveNotes(){ try { localStorage.setItem("krtc-note", JSON.stringify(notes)); } catch (e) {} }
const routeKey = (o, d) => o + "|" + d;
const isTransfer = (o, d) => !byName[o].lines.some(L => byName[d].lines.includes(L));
const carIcon = c => `<span class="cars" aria-hidden="true">${["front","mid","rear"].map(k => `<i class="${k===c?"on":""}"></i>`).join("")}</span>`;
const esc = t => t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let noteShown = null, noteEditing = false;

function carSelect(id, val) {
  return `<select id="${id}"><option value="">不確定</option>${Object.entries(CARS).map(([k,[a,b]]) =>
    `<option value="${k}"${k===val?" selected":""}>${a}（${b}）</option>`).join("")}</select>`;
}
function renderNote(force) {
  const o = els.from.value, d = els.to.value, key = routeKey(o, d);
  if (!force && key === noteShown) return;
  noteShown = key;
  const box = $("noteCard");
  if (o === d) { box.hidden = true; return; }
  box.hidden = false;
  const n = notes[key], xf = isTransfer(o, d);
  if (noteEditing) {
    box.innerHTML = `<h3>車廂備註：${o} → ${d}</h3>
      <div class="nedit">
        <div class="field"><label for="nCar1">在${o}上車，哪節比較少人</label>${carSelect("nCar1", n?.car1)}</div>
        ${xf ? `<div class="field"><label for="nCar2">在美麗島轉乘後，哪節比較少人</label>${carSelect("nCar2", n?.car2)}</div>` : ""}
        <div class="field"><label for="nText">其他備註（例如：早上第 3 節比較空、靠近電扶梯的門很擠）</label><textarea id="nText" maxlength="300">${esc(n?.text || "")}</textarea></div>
        <p class="hint">「車頭」是指列車行進方向的最前面一節。高捷每列車有 3 節車廂。</p>
        <div class="nactions">
          <button type="button" class="nbtn primary" id="nSave">儲存備註</button>
          <button type="button" class="nbtn" id="nCancel">取消</button>
          ${n ? `<button type="button" class="nbtn link danger" id="nDel">刪除這則備註</button>` : ""}
        </div>
      </div>`;
    $("nSave").onclick = () => {
      const car1 = $("nCar1").value, car2 = xf ? $("nCar2").value : "", text = $("nText").value.trim();
      if (car1 || car2 || text) notes[key] = {car1, car2, text, t: Date.now()}; else delete notes[key];
      saveNotes(); noteEditing = false; renderNote(true); render();
    };
    $("nCancel").onclick = () => { noteEditing = false; renderNote(true); };
    if ($("nDel")) $("nDel").onclick = () => { delete notes[key]; saveNotes(); noteEditing = false; renderNote(true); render(); };
    $("nText").focus({preventScroll:true});
    return;
  }
  const officialHint = `<p class="hint">即時的車廂擁擠度目前只有高雄捷運官方 App「高雄捷運—通勤助理」提供，這裡的備註是你自己記下的經驗。</p>`;
  if (!n) {
    box.innerHTML = `<button type="button" class="addnote" id="nAdd">＋ 寫備註：記下${o} → ${d}哪節車廂比較少人</button>${officialHint}`;
  } else {
    const line = (label, c) => c ? `<div class="ncar">${carIcon(c)}<span>${label}：<b>${CARS[c][0]}（${CARS[c][1]}）</b>比較少人</span></div>` : "";
    const when = new Date(n.t);
    box.innerHTML = `<h3><span>我的車廂備註</span><button type="button" class="nbtn link" id="nAdd">編輯</button></h3>
      ${line(`在${o}上車`, n.car1)}${xf ? line("美麗島轉乘後", n.car2) : ""}
      ${n.text ? `<p class="ntext">${esc(n.text)}</p>` : ""}
      <p class="hint">記於 ${when.getMonth()+1}/${when.getDate()}。即時擁擠度請看高雄捷運官方 App。</p>`;
  }
  $("nAdd").onclick = () => { noteEditing = true; renderNote(true); };
}

function stripe(r) { return `<span class="stripe" aria-hidden="true">${r.legs.map(l => `<i class="${l.trip.L}"></i>`).join("")}</span>`; }

function legDetail(l, isLast) {
  const t = l.trip, items = [];
  for (let k = l.i; k <= l.j; k++) {
    const est = k === t.stops.length - 1;
    items.push(`<li class="${k===l.i||k===l.j?"end":""}"><b>${est?"約":""}${fmt(t.times[k])}</b><span>${t.stops[k]}　${nameOf[t.stops[k]]}</span></li>`);
  }
  return `<div class="leg ${t.L}"><h4><span class="pill ${t.L}">${LINE_NAME[t.L]}</span>往${t.head}・${l.j - l.i} 站</h4><ol class="stops">${items.join("")}</ol></div>`;
}

function render() {
  const openKeys = new Set([...document.querySelectorAll("details.trip[open]")].map(d => d.dataset.key));
  renderInner();
  document.querySelectorAll("details.trip").forEach(d => { if (openKeys.has(d.dataset.key)) d.open = true; });
}

function renderInner() {
  const o = els.from.value, d = els.to.value, day = +els.day.value;
  const mode = $("modeArr").checked ? "arr" : "dep";
  const xfer = Math.max(1, Math.min(15, +els.xfer.value || 4));
  try { localStorage.setItem("krtc-q", JSON.stringify({from:o, to:d, mode, xfer})); } catch (e) {}
  dayHint();
  renderFavs();
  if (noteShown !== routeKey(o, d)) noteEditing = false;
  renderNote();
  $("moreSum").textContent = `${DAY_SHORT[day]}・轉乘 ${xfer} 分`;

  let a = parseT(els.tFrom.value), b = parseT(els.tTo.value);
  if (a === null) a = 330; if (b === null) b = 1500;
  a = toSvc(a); b = toSvc(b); if (b < a) b += 1440;

  const sum = $("summary"), list = $("list");
  const routeHtml = `<div class="route"><span>${o}</span><span class="arrow">→</span><span>${d}</span></div>`;
  if (o === d) {
    sum.innerHTML = routeHtml + `<p class="note">起站和終站相同，請換一個終站。</p>`;
    list.innerHTML = `<div class="empty"><strong>請選擇不同的起站與終站</strong></div>`;
    return;
  }

  const {res, direct} = search(o, d, day, xfer);
  const inRange = res.filter(r => { const v = mode === "dep" ? r.dep : r.arr; return v >= a && v <= b; });
  const now = nowSvc(), live = day === todayDay;
  const upcoming = live ? inRange.filter(r => r.dep >= now) : inRange;
  const next = live ? upcoming[0] : null;
  const fastest = inRange.length ? Math.min(...inRange.map(r => r.arr - r.dep)) : null;
  const viaText = direct ? `直達，${LINE_NAME[lineOf[byName[o].ids.find(id => byName[d].ids.some(x => lineOf[x] === lineOf[id]))]]}` : `需在美麗島站轉乘（預留 ${xfer} 分鐘）`;

  sum.innerHTML = routeHtml +
    `<div class="stats">
       <div class="stat"><div class="k">${mode==="dep"?"上車":"抵達"} ${fmt(a)}–${fmt(b)} 的班次</div><div class="v">${inRange.length}<small>班</small></div></div>
       <div class="stat"><div class="k">${live ? "下一班上車" : "第一班上車"}</div><div class="v">${(next||inRange[0]) ? fmt((next||inRange[0]).dep) : "—"}${next ? `<small>${next.dep - now === 0 ? "現在" : (next.dep - now) + " 分鐘後"}</small>` : ""}</div></div>
       <div class="stat"><div class="k">最短車程</div><div class="v">${fastest ?? "—"}<small>分鐘</small></div></div>
     </div>
     <p class="note">${viaText}。${DAY_SHORT[day]}時刻表。點任一班可看沿途每站時間。</p>`;

  if (!inRange.length) {
    const later = res.find(r => (mode === "dep" ? r.dep : r.arr) > b);
    list.innerHTML = `<div class="empty"><strong>這個時間範圍內沒有班次</strong>${later ? `範圍後的下一班是 ${fmt(later.dep)} 上車、${later.est?"約 ":""}${fmt(later.arr)} 抵達。` : "這天已經沒有車了。"}請把時間範圍放寬一點。</div>`;
    return;
  }

  list.innerHTML = inRange.map(r => {
    const w = r.dep - now, isNext = r === next, past = live && w < 0;
    const waitTxt = live ? (past ? "已開走" : w === 0 ? "現在" : w <= 120 ? `${w} 分鐘後` : "") : "";
    const nt = notes[routeKey(o, d)];
    const less = c => c ? `<span class="pill less">少人：${CARS[c][0]}</span>` : "";
    const pills = r.legs.map((l, k) =>
      (k ? `<span class="pill xfer">美麗島轉乘・等 ${r.wait} 分</span>` : "") +
      `<span class="pill ${l.trip.L}">${LINE_NAME[l.trip.L]} 往${l.trip.head}</span>` +
      less(k ? nt?.car2 : nt?.car1)).join("");
    const detail = r.legs.map((l, k) =>
      (k ? `<div class="xferline">在美麗島換車：${fmt(r.legs[0].arr)} 下車，${fmt(l.dep)} 上車（等 ${r.wait} 分鐘）</div>` : "") + legDetail(l)).join("");
    const key = r.legs.map(l => l.trip.L + l.trip.times[0] + l.trip.stops[0]).join("_");
    return `<details class="trip${isNext?" next":""}${past?" past":""}" data-key="${key}">
      <summary>
        ${stripe(r)}
        <div class="times">
          <span class="t">${fmt(r.dep)}</span><span class="sep">→</span><span class="t arr">${r.est?"約":""}${fmt(r.arr)}</span>
          <div class="meta">${pills}</div>
        </div>
        <div class="right"><span class="dur">${r.arr - r.dep}<small>分</small></span>${waitTxt ? `<span class="wait">${isNext ? "下一班・" : ""}${waitTxt}</span>` : ""}</div>
      </summary>
      <div class="legs">${detail}</div>
    </details>`;
  }).join("");
}

$("form").addEventListener("input", render);
$("form").addEventListener("submit", e => { e.preventDefault(); render(); });
$("swap").addEventListener("click", () => { const t = els.from.value; els.from.value = els.to.value; els.to.value = t; render(); });
document.querySelectorAll("[data-range]").forEach(btn => btn.addEventListener("click", () => {
  const v = btn.dataset.range; setRange(v === "all" ? "all" : +v); render();
}));
setInterval(render, 30000);   // 每 30 秒更新倒數
$("foot").textContent = `資料來源：${DATA.src}。標「約」的時間為終點站到站時間，由站間行駛時間推算。實際以高雄捷運現場公告為準。`;
render();
const syncOnline = () => document.body.classList.toggle("is-offline", !navigator.onLine);
addEventListener("online", syncOnline); addEventListener("offline", syncOnline); syncOnline();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
