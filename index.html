<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高捷班次</title>
<meta name="description" content="高雄捷運紅線、橘線班次查詢：下一班倒數、到站時間、美麗島轉乘、最近車站與地圖。可離線使用。">
<meta name="theme-color" content="#0d1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="高捷班次">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* 版面：手機為單欄 App（底部分頁列）；寬螢幕左欄放行程與發車看板、右欄放班次清單與地圖。
   唯一的大膽處是深色「發車看板」與琥珀色大數字，其餘保持安靜；紅、橘只用來代表路線。 */
:root{
  --bg:#eceef2;
  --surface:#ffffff;
  --ink:#121822;
  --muted:#5c6575;
  --line:#dde1e8;
  --soft:#f4f5f8;
  --board:#0d1420;
  --board-ink:#e8edf5;
  --amber:#ffb23e;
  --red:#e1252f;
  --orange:#f39800;
  --good:#128556;
  --focus:#2f6fd6;
  --font-display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --radius:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090d13; --surface:#131922; --ink:#e9edf3; --muted:#9aa3b1; --line:#252d39; --soft:#1a212c;
    --board:#05080d; --board-ink:#e8edf5; --amber:#ffb84d; --red:#ff4b55; --orange:#ffa526; --good:#3fcf8e; --focus:#7fb0ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090d13; --surface:#131922; --ink:#e9edf3; --muted:#9aa3b1; --line:#252d39; --soft:#1a212c;
  --board:#05080d; --board-ink:#e8edf5; --amber:#ffb84d; --red:#ff4b55; --orange:#ffa526; --good:#3fcf8e; --focus:#7fb0ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ---------- 外框 ---------- */
.app{max-width:560px;margin:0 auto;min-height:100%;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:grid;gap:14px;align-content:start}
.col-side,.col-main{display:grid;gap:14px;align-content:start;min-width:0}
@media (min-width:980px){
  .app{max-width:1160px;grid-template-columns:400px 1fr;gap:24px;padding:28px 28px 40px;align-items:start}
  .col-side{position:sticky;top:20px}
}

/* ---------- 頂列 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:.04em}
.brand svg{width:30px;height:30px;flex:none}
.offline{display:none;font-size:11px;font-weight:700;color:var(--good);border:1px solid currentColor;border-radius:999px;padding:1px 8px;letter-spacing:0}
body.is-offline .offline{display:inline-block}
.daychip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:36px}
.daychip i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.daychip.manual i{background:var(--amber)}

/* ---------- 行程卡 ---------- */
.journey{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);position:relative;padding:6px 64px 6px 16px}
.stn{position:relative;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px 0;min-height:66px}
.stn+.stn{border-top:1px dashed var(--line)}
.stn select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.stn .k{display:block;font-size:12px;color:var(--muted);font-weight:500;line-height:1.2;letter-spacing:.08em}
.stn .v{display:block;font-size:22px;font-weight:900;line-height:1.25;letter-spacing:.02em;overflow-wrap:anywhere}
.stn .chev{position:absolute;right:0;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
.stn:focus-within{outline:2px solid var(--focus);outline-offset:-2px;border-radius:10px}
.badges{display:flex;flex-direction:column;gap:3px;align-items:center}
.badge{display:inline-grid;place-items:center;min-width:40px;height:30px;padding:0 5px;border-radius:7px;color:#fff;font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.02em;line-height:1}
.badge.R{background:var(--red)} .badge.O{background:var(--orange)}
.badges.two .badge{height:22px;font-size:14px;min-width:38px}
.swap{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);cursor:pointer;display:grid;place-items:center;transition:transform .25s}
.swap:hover{border-color:var(--focus)}
.swap.spin{transform:translateY(-50%) rotate(180deg)}
.swap svg{width:18px;height:18px}
.star{position:absolute;right:12px;top:10px;border:0;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);padding:4px;min-width:32px;min-height:32px}
.star.on{color:var(--amber)}
.favs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.favs::-webkit-scrollbar{display:none}
.favs:empty{display:none}
.fav{flex:none;display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:14px;font-weight:500}
.fav button{border:0;background:none;cursor:pointer;padding:7px 4px 7px 12px;min-height:38px}
.fav button.x{color:var(--muted);padding:7px 11px 7px 4px;font-size:12px}
.fav.on{border-color:var(--ink)}

/* ---------- 時間 ---------- */
.when{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:7px 4px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500}
.seg input:checked+label{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+label{outline:2px solid var(--focus)}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.range input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;min-height:44px;font-size:16px}
.range span{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;min-height:34px}
.chip:hover{border-color:var(--ink)}

/* ---------- 發車看板 ---------- */
.board{position:relative;overflow:hidden;background:var(--board);color:var(--board-ink);border-radius:20px;padding:18px 18px 16px;display:grid;gap:14px;isolation:isolate}
.board::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.13;background-image:radial-gradient(circle,#fff 1px,transparent 1.3px);background-size:6px 6px;-webkit-mask-image:linear-gradient(115deg,#000 0%,transparent 70%);mask-image:linear-gradient(115deg,#000 0%,transparent 70%)}
.board::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--red) 0 50%,var(--orange) 50% 100%)}
.b-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;color:#9fb0c8}
.b-head b{color:var(--amber);font-weight:700;letter-spacing:.12em}
.b-main{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.b-count{display:flex;align-items:baseline;gap:8px;color:var(--amber)}
.b-count .big{font-family:var(--font-display);font-weight:800;font-size:92px;line-height:.82;font-variant-numeric:tabular-nums}
.b-count .unit{font-size:16px;font-weight:700}
.b-count.small .big{font-size:64px}
.b-times{display:flex;align-items:center;gap:10px}
.b-times div{display:grid;gap:2px}
.b-times small{font-size:11px;color:#9fb0c8;letter-spacing:.1em}
.b-times b{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.b-times .arr{color:#6f819b;font-size:18px;align-self:end;padding-bottom:4px}
.b-route{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08)}
.lchip i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;color:#fff;font-family:var(--font-display)}
.lchip i.R{background:var(--red)} .lchip i.O{background:var(--orange)}
.lchip.x{background:none;border:1px dashed rgba(255,255,255,.3);padding:3px 10px;font-weight:500}
.b-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#9fb0c8;border-top:1px solid rgba(255,255,255,.1);padding-top:10px;padding-bottom:4px}
.b-stats b{font-family:var(--font-display);font-size:20px;color:var(--board-ink);font-weight:700;margin-right:2px}
.b-empty{font-size:16px;font-weight:700;color:var(--board-ink)}
.b-empty small{display:block;font-weight:400;font-size:13px;color:#9fb0c8;margin-top:4px}
.tick{animation:tick .5s ease}
@keyframes tick{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 備註 ---------- */
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:8px}
.note[hidden]{display:none}
.note h3{margin:0;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);letter-spacing:.06em}
.ncar{display:flex;gap:10px;align-items:center;font-size:14px}
.ncar b{color:var(--good)}
.cars{display:inline-flex;gap:3px}
.cars i{width:20px;height:11px;border-radius:3px;border:1.5px solid var(--muted)}
.cars i.on{background:var(--good);border-color:var(--good)}
.cars i:first-child{border-top-left-radius:7px;border-bottom-left-radius:7px}
.ntext{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.addnote{text-align:left;background:none;border:0;color:var(--muted);padding:2px 0;cursor:pointer;font-size:14px;min-height:36px;display:flex;align-items:center;gap:8px}
.addnote b{color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--focus);cursor:pointer;font-size:13px;padding:4px 0;min-height:32px}
.nedit{display:grid;gap:10px}
.field{display:grid;gap:5px}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 10px;min-height:44px;font-size:16px}
.field textarea{min-height:72px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:42px;font-size:14px;font-weight:500}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
.btn.danger{color:var(--red);background:none;border-color:transparent}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.hint{margin:0;font-size:12px;color:var(--muted)}

/* ---------- 班次清單 ---------- */
.listhead{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.listhead h2{margin:0;font-size:15px;font-weight:700}
.listhead span{font-size:12px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:76px 1fr 64px;gap:12px;align-items:center;padding:12px 14px}
.row>summary::-webkit-details-marker{display:none}
.row>summary:hover{background:var(--soft)}
.r-time b,.r-end b{display:block;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.r-time b{font-size:30px}
.r-time small{font-size:12px;color:var(--good);font-weight:700;white-space:nowrap}
.r-end{text-align:right}
.r-end b{font-size:22px;color:var(--muted);font-weight:600}
.r-end small{font-size:12px;color:var(--muted)}
.r-mid{display:grid;gap:6px;min-width:0}
.jbar{display:flex;height:8px;gap:2px;transform-origin:left;animation:grow .5s ease both}
.jbar i{border-radius:4px;min-width:4px}
.jbar i.R{background:var(--red)} .jbar i.O{background:var(--orange)}
.jbar i.w{background:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 6px);opacity:.6;height:2px;align-self:center}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.r-meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.r-meta .less{color:var(--good);font-weight:700}
.list.calm .jbar{animation:none}
.row.past{opacity:.45}
.row.next{background:color-mix(in srgb,var(--amber) 9%,transparent)}
.est{font-size:.6em;color:var(--muted);margin-right:2px;font-family:var(--font-body);font-weight:500}
.detail{padding:2px 16px 16px 16px;display:grid;gap:12px}
.leg h4{margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center}
.stops{list-style:none;margin:0;padding:0;display:grid;position:relative}
.stops li{display:grid;grid-template-columns:52px 18px 1fr;align-items:center;font-size:13px;color:var(--muted);min-height:24px}
.stops li b{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.stops li .pt{width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--c);justify-self:center;position:relative;z-index:1}
.stops li.end{color:var(--ink);font-weight:700}
.stops li.end .pt{background:var(--c)}
.stops::before{content:"";position:absolute;left:60px;top:12px;bottom:12px;width:3px;background:var(--c);border-radius:2px}
.leg.R{--c:var(--red)} .leg.O{--c:var(--orange)}
.xline{font-size:13px;color:var(--muted);padding:6px 10px;border:1px dashed var(--line);border-radius:10px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- 地圖 ---------- */
.mapview{display:grid;gap:12px}
.mapwrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
#map{height:calc(100dvh - 170px - env(safe-area-inset-bottom));min-height:420px;z-index:0;background:var(--soft)}
@media (min-width:980px){#map{height:calc(100vh - 90px)}}
.maptoast{position:absolute;left:12px;right:72px;top:12px;z-index:500;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.12);pointer-events:none}
.mapfabs{position:absolute;right:12px;bottom:calc(16px + 0px);z-index:500;display:grid;gap:10px}
.fab{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.fab svg{width:22px;height:22px}
.fab.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fab.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.leaflet-control-zoom{border:0!important;box-shadow:0 4px 16px rgba(0,0,0,.18)!important;border-radius:12px!important;overflow:hidden;margin-top:64px!important}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important;width:40px!important;height:40px!important;line-height:40px!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-container{font-family:var(--font-body);background:var(--soft)}
.stlabel{background:none;border:0;box-shadow:none;padding:0 2px;font:700 12px var(--font-body);color:var(--ink);text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 3px var(--surface);display:none}
.stlabel::before{display:none}
.show-labels .stlabel{display:block}
.stlabel.xf{font-size:13px}
.endpin{display:flex;align-items:center;gap:5px;transform:translate(-14px,-38px);white-space:nowrap}
.endpin b{display:grid;place-items:center;width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.3)}
.endpin b span{transform:rotate(45deg);color:var(--surface);font-size:13px;font-weight:900}
.endpin.to b{background:var(--good)}
.endpin em{font-style:normal;font-size:12px;font-weight:700;background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 8px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.me{position:relative;width:18px;height:18px}
.me i{position:absolute;inset:0;border-radius:50%;background:#2f6fd6;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.me::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:#2f6fd6;opacity:.25;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(.3);opacity:.45}to{transform:scale(1.3);opacity:0}}
.leaflet-popup-content-wrapper{border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:14px 16px;min-width:230px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted);top:6px;right:6px}
.pop{display:grid;gap:10px}
.pop-h{display:flex;align-items:center;gap:10px}
.pop-h h4{margin:0;font-size:18px;font-weight:900}
.pop-h p{margin:0;font-size:12px;color:var(--muted)}
.deps{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.dep i{width:8px;height:8px;border-radius:50%}
.dep i.R{background:var(--red)} .dep i.O{background:var(--orange)}
.dep b{font-family:var(--font-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.dep b small{font-family:var(--font-body);font-size:11px;color:var(--good);font-weight:700;margin-left:4px}
.dep .none{color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts a,.acts button{font-size:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:7px 11px;cursor:pointer;text-decoration:none;min-height:38px;display:inline-flex;align-items:center;font-weight:500}
.acts a.gmap{background:var(--ink);border-color:var(--ink);color:var(--surface)!important}
.near{display:grid;gap:8px}
.near:empty{display:none}
.nearrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.nearrow .nm{font-weight:900;font-size:16px;display:flex;align-items:center;gap:10px}
.nearrow .dist{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;text-align:right}
.nearrow .dist b{display:block;font-family:var(--font-display);font-size:20px;color:var(--ink)}

/* ---------- 設定 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px}
.card h2{margin:0;font-size:15px}
.days{display:grid;gap:8px}
.dayopt{position:relative}
.dayopt input{position:absolute;opacity:0}
.dayopt label{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;min-height:48px}
.dayopt label small{color:var(--muted);font-size:12px}
.dayopt label em{font-style:normal;font-size:11px;font-weight:700;color:var(--good);border:1px solid currentColor;border-radius:999px;padding:0 7px}
.dayopt input:checked+label{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.dayopt input:focus-visible+label{outline:2px solid var(--focus)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-size:20px}
.stepper output{font-family:var(--font-display);font-size:32px;font-weight:700;min-width:44px;text-align:center}
.about{font-size:13px;color:var(--muted);display:grid;gap:6px}
.about p{margin:0}

/* ---------- 底部分頁 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px max(10px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}
.tabbar button{border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:6px 0;min-height:52px}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar button[aria-current="page"] svg{color:var(--red)}
@media (min-width:980px){
  .tabbar{position:static;grid-column:1;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:6px;backdrop-filter:none}
}
.view[hidden]{display:none!important}
.footer{font-size:11px;color:var(--muted);padding:0 4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app">
  <div class="col-side">
    <div class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0d1420"/><rect x="14" y="5" width="4" height="22" rx="2" fill="#e1252f"/><rect x="5" y="14" width="22" height="4" rx="2" fill="#f39800"/><circle cx="16" cy="16" r="5" fill="#fff"/><circle cx="16" cy="16" r="2.4" fill="#0d1420"/></svg>
        高捷班次
        <span class="offline">離線</span>
      </div>
      <button type="button" class="daychip" id="dayChip" aria-label="更改時刻表日別"><i></i><span id="dayChipText">平日</span></button>
    </div>

    <section class="journey" aria-label="行程">
      <div class="stn">
        <span class="badges" id="fromBadge"></span>
        <span><span class="k">出發</span><span class="v" id="fromName"></span></span>
        <select id="from" aria-label="起站"></select>
      </div>
      <div class="stn">
        <span class="badges" id="toBadge"></span>
        <span><span class="k">抵達</span><span class="v" id="toName"></span></span>
        <select id="to" aria-label="終站"></select>
      </div>
      <button type="button" class="swap" id="swap" aria-label="對調起站與終站"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4m0 16-4-4m4 4 4-4"/></svg></button>
    </section>
    <div class="favs" id="favs" aria-label="常用路線"></div>

    <section class="when" aria-label="時間範圍">
      <div class="seg" role="radiogroup" aria-label="時間範圍是指">
        <input type="radio" name="mode" id="modeDep" value="dep" checked><label for="modeDep">依上車時間</label>
        <input type="radio" name="mode" id="modeArr" value="arr"><label for="modeArr">依抵達時間</label>
      </div>
      <div class="range">
        <input type="time" id="tFrom" step="60" aria-label="從">
        <span>到</span>
        <input type="time" id="tTo" step="60" aria-label="到">
      </div>
      <div class="chips">
        <button type="button" class="chip" data-range="60">現在起 1 小時</button>
        <button type="button" class="chip" data-range="180">3 小時</button>
        <button type="button" class="chip" data-range="all">整天</button>
      </div>
    </section>

    <section class="board view" id="board" data-view="list" aria-live="polite"></section>

    <nav class="tabbar" aria-label="主選單">
      <button type="button" data-tab="list" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>班次</button>
      <button type="button" data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>地圖</button>
      <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
    </nav>
  </div>

  <main class="col-main">
    <section class="view" data-view="list">
      <div style="display:grid;gap:12px">
        <div class="note" id="note"></div>
        <div class="listhead"><h2 id="listTitle">班次</h2><span>點一班看沿途每站</span></div>
        <div class="list" id="list"></div>
      </div>
    </section>

    <section class="view mapview" data-view="map" hidden>
      <div class="mapwrap">
        <div id="map" role="application" aria-label="高雄捷運路線地圖"></div>
        <div class="maptoast" id="locMsg" role="status">點車站看下一班車，也能設成起站、終站或導航過去</div>
        <div class="mapfabs">
          <button type="button" class="fab" id="fitRoute" aria-label="顯示整條路線" title="顯示整條路線"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button type="button" class="fab primary" id="locate" aria-label="找離我最近的車站" title="找離我最近的車站"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
        </div>
      </div>
      <div class="near" id="nearList"></div>
    </section>

    <section class="view" data-view="settings" hidden>
      <div style="display:grid;gap:12px">
        <div class="card">
          <h2>時刻表日別</h2>
          <div class="days" id="days" role="radiogroup" aria-label="時刻表日別"></div>
          <p class="hint">會依今天日期自動選擇。國定假日請選「假日」，國定假日前一天請選「假日前一天」。</p>
        </div>
        <div class="card">
          <h2>美麗島轉乘預留時間</h2>
          <div class="stepper">
            <button type="button" id="xMinus" aria-label="減少一分鐘">−</button>
            <output id="xVal">4</output><span>分鐘</span>
            <button type="button" id="xPlus" aria-label="增加一分鐘">+</button>
          </div>
          <p class="hint">紅線、橘線互轉時，在美麗島站換月台需要的時間。走得快可以調低。</p>
        </div>
        <div class="card about">
          <h2 style="color:var(--ink)">關於資料</h2>
          <p id="srcText"></p>
          <p>標「約」的時間是終點站到站時間，由站間行駛時間推算，誤差約一分鐘。實際以高雄捷運現場公告為準。</p>
          <p>即時車廂擁擠度請看高雄捷運官方 App「高雄捷運—通勤助理」。常用路線與車廂備註只存在這支手機。</p>
        </div>
      </div>
    </section>
    <p class="footer" id="footer"></p>
  </main>
</div>

function tileURL() {

  const dark = theme ? theme === "dark" : darkMQ.matches;
  return `https://{s}.basemaps.cartocdn.com/${dark ? "dark_all" : "light_all"}/{z}/{x}/{y}{r}.png`;

function nextDeps(name, count = 2) {
  const st = byName[name], now = nowSvc(), live = state.day === todayDay, groups = {};
  for (const id of st.ids) for (const t of (tripsBy[state.day]?.[lineOf[id]] || [])) {
    const i = t.idx[id];
    if (i === undefined || i === t.stops.length - 1) continue;
    const dep = t.times[i];
    if (live && dep < now) continue;
    (groups[t.L + "|" + t.head] ||= []).push(dep);
  }
  return Object.entries(groups).map(([k, v]) => { const [L_, head] = k.split("|"); return {L: L_, head, deps: v.sort((a, b) => a - b).slice(0, count)}; })
    .sort((a, b) => (a.L + a.head).localeCompare(b.L + b.head));
}

    <div class="deps">${rows}</div>

function onStationAct(e) {

function pathIds(o, d) {

    const seq = DATA.lines[lineOf[oid]].map(x => x[0]), i = seq.indexOf(oid), j = seq.indexOf(did);

let lastRouteKey = "";
function drawRoute(fit) {

  routeLayer = L.layerGroup().addTo(map);
  const pts = [];

    L.polyline(ll, {color: c, weight: 18, opacity: .18, interactive: false}).addTo(routeLayer);
    L.polyline(ll, {color: cssVar("--surface"), weight: 11, interactive: false}).addTo(routeLayer);

    icon: L.divIcon({className: "", html: `<div class="endpin ${cls}"><b><span>${t}</span></b><em>${nm}</em></div>`, iconSize: [0, 0]})}).addTo(routeLayer);
  pin(o, "起", "from"); pin(d, "終", "to");

$("fitRoute").onclick = () => { if (!map) return; if (state.from !== state.to) drawRoute(true); else map.setView([22.665, 120.315], 12); };
function haversine(a, b) {
  const r = x => x * Math.PI / 180, dLat = r(b[0] - a[0]), dLon = r(b[1] - a[1]);

    const me = [pos.coords.latitude, pos.coords.longitude];
    const near = stations.map(st => ({st, id: st.ids[0], d: haversine(me, COORDS[st.ids[0]])})).sort((x, y) => x.d - y.d).slice(0, 3);
    msg.textContent = near[0].d > 30000 ? "你離高雄捷運很遠，下面是直線距離最近的車站" : `最近的車站是${near[0].st.name}，往下滑看其他車站`;
    $("nearList").innerHTML = near.map(n => {
      const dist = n.d < 1000 ? Math.round(n.d) + " 公尺" : (n.d / 1000).toFixed(1) + " 公里";
      const g = nextDeps(n.st.name, 1).filter(x => x.deps.length).map(x => `往${x.head} <b class="num">${fmt(x.deps[0])}</b>`).join("　");
      return `<div class="nearrow"><div class="nm"><span class="badges${n.st.ids.length > 1 ? " two" : ""}">${badgeHTML(n.st.name)}</span>${n.st.name}<span class="dist"><b>${Math.max(1, Math.round(n.d * 1.25 / 70))} 分</b>步行・${dist}</span></div>${g ? `<div class="hint">下一班：${g}</div>` : ""}${stationActs(n.st.name, n.id)}</div>`;
    }).join("");
    if (map) {
      if (userLayer) userLayer.remove();
      userLayer = L.layerGroup([
        L.circle(me, {radius: Math.min(pos.coords.accuracy, 300), color: "#2f6fd6", weight: 1, fillOpacity: .08, interactive: false}),
        L.marker(me, {icon: L.divIcon({className: "", html: '<div class="me"><i></i></div>', iconSize: [18, 18], iconAnchor: [9, 9]}), interactive: false})
      ]).addTo(map);
      map.flyToBounds(L.latLngBounds([me, ...near.map(n => COORDS[n.id])]).pad(.3), {paddingTopLeft: [10, 60], maxZoom: 16, duration: .8});
    }
  }, err => {
    btn.classList.remove("busy");
    msg.textContent = err.code === 1 ? "沒有定位權限，請在手機設定允許這個 App 使用位置" : "暫時抓不到位置，請稍後再試";
  }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000});
};

// ---------- 分頁 ----------
function showView(v) {
  state.view = v;
  document.querySelectorAll(".view").forEach(s => { s.hidden = s.dataset.view !== v; });
  document.querySelectorAll(".tabbar button").forEach(b => { if (b.dataset.tab === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  if (v === "map") {
    if (!initMap()) { $("locMsg").textContent = "地圖需要網路才能第一次載入。"; return; }
    setTimeout(() => { map.invalidateSize(); drawRoute(); }, 60);
    $("locMsg").hidden = false;
  }
  if (matchMedia("(max-width: 979px)").matches) window.scrollTo({top: v === "list" ? 0 : document.querySelector(".col-main").offsetTop - 10, behavior: "instant"});
}
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => showView(b.dataset.tab));
$("dayChip").onclick = () => showView("settings");

// ---------- 事件 ----------
els.from.onchange = () => { state.from = els.from.value; render(); };
els.to.onchange = () => { state.to = els.to.value; render(); };
$("swap").onclick = () => { [state.from, state.to] = [state.to, state.from]; const s = $("swap"); s.classList.toggle("spin"); render(); };
for (const id of ["modeDep", "modeArr"]) $(id).onchange = e => { state.mode = e.target.value; render(); };
els.tFrom.oninput = els.tTo.oninput = render;
document.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { setRange(b.dataset.range === "all" ? "all" : +b.dataset.range); render(); });
$("days").onchange = e => { state.day = +e.target.value; render(); };
$("xMinus").onclick = () => { state.xfer = Math.max(1, state.xfer - 1); render(); };
$("xPlus").onclick = () => { state.xfer = Math.min(15, state.xfer + 1); render(); };
setInterval(render, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

const syncOnline = () => document.body.classList.toggle("is-offline", !navigator.onLine);
addEventListener("online", syncOnline); addEventListener("offline", syncOnline); syncOnline();
render();
if ("serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
