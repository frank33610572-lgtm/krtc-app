name: hours-monthly
# 每月 1 號（台灣時間上午 11:17）重抓營業時間來源，重建 stores.json
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hours:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/fetch_hours.py
      - name: rebuild stores.json
        run: |
          cp data/stores_base.json stores.json
          python tools/build_hours.py stores.json data/osm_hours.txt data/chain_hours.txt data/chain_hours2.txt
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm_hours.txt data/chain_hours2.txt stores.json
          git diff --cached --quiet || (git commit -m "資料：每月更新營業時間" && git push)
