name: build-places
on:
  push:
    paths: ["tools/**", ".github/workflows/build-places.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  need:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/build_need.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/need.json
          git diff --cached --quiet || (git commit -m "資料：更新待比對店家清單（稅籍登記）" && git push)
